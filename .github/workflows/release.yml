name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          modules: qtmultimedia qtshadertools

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target mediaflow

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          ./packaging/build_installer.ps1 `
            -QtBin (Join-Path $env:QT_ROOT_DIR "bin") `
            -BuildExe "build/MediaFlow.exe" `
            -InnoSetupCompiler $iscc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaFlow-Windows-Installer
          path: packaging/installer_output/MediaFlow-Setup-*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          $installer = "packaging/installer_output/MediaFlow-Setup-$version.exe"
          $sha256 = (Get-FileHash -Algorithm SHA256 $installer).Hash
          $notes = @"
          ### Changes in $tag

          - Shows the configured Extended Feed background on Zoom when webcam fallback is off or the camera stops producing frames.
          - Added a persistent, app-wide BGM player with separate library, album, playlist, and playback state.
          - Added album browsing, queue controls, shuffle/repeat, and safer asynchronous loading and seeking.
          - Improved audio-device selection, media transitions, fullscreen behavior, and application shutdown.

          SHA-256: ``$sha256``
          "@
          gh release create $tag $installer --title "MediaFlow $tag" --notes $notes --latest --verify-tag
